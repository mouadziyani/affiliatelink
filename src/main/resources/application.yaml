spring:
  application:
    name: affiliatelink

  datasource:
    url: jdbc:postgresql://localhost:5432/affiliatelink
    username: ${POSTGRES_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
